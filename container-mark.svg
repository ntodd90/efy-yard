<svg xmlns="http://www.w3.org/2000/svg" width="56" height="44" viewBox="0 0 56 44">
  <title>Freight container</title>
  <style>
    .container { transform-box: fill-box; transform-origin: center; animation: bob 4.8s ease-in-out infinite; }
    .glint { opacity: 0; animation: glint 4.8s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
    @keyframes glint { 0%, 12% { transform: translateX(0); opacity: 0; } 28% { opacity: .34; } 48%, 100% { transform: translateX(30px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .container, .glint { animation: none; } }
  </style>
  <g class="container">
    <rect x="4" y="7" width="48" height="29" rx="2" fill="#ca4d32" stroke="#fffef8" stroke-width="1.5"/>
    <path d="M10 10v23m6-23v23m6-23v23m6-23v23m6-23v23m6-23v23m6-23v23" fill="none" stroke="#fffef8" stroke-width="1.2" stroke-linecap="round" opacity=".62"/>
    <path d="M45 8v27m3-24v21M4 11h3m-3 21h3m42-21h3m-3 21h3" fill="none" stroke="#18332e" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="glint" x="9" y="10" width="5" height="23" rx="2" fill="#fffef8"/>
    <path d="M7 39h42M9 36v3m38-3v3" fill="none" stroke="#d9ed4d" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>